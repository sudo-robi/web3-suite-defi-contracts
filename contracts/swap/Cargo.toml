[package]
name = "swap-contract"
version = "0.1.0"
edition = "2021"
description = "Constant-product AMM token swap contract for Stellar/Soroban"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
